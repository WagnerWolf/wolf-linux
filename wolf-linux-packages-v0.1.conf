# ============================================================
# WOLF LINUX - MANIFESTO INICIAL DE PACOTES v0.1
# ============================================================
# Arquivo pensado para ser "source" pelo wolf-install.sh.
# Pacotes oficiais ficam separados de software Chaotic-AUR/AUR.
#
# Diretrizes:
# - Arch Linux puro
# - linux-zen
# - multilib
# - Chaotic-AUR
# - SDDM em MATE, Cinnamon e Plasma
# - PipeWire + WirePlumber em todos os desktops
# - Zsh + Powerlevel10k em todos os desktops
# ============================================================


