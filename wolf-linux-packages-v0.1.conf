# ------------------------------------------------------------
# MATE
# ------------------------------------------------------------
MATE_PACKAGES=(
    mate
    mate-extra

    mate-terminal
    atril
    mate-media
    pluma
    mate-calc
    network-manager-applet

    materia-gtk-theme
    python-pillow

    # Integrações Wolf Linux para MATE/Caja/X11.
    python-caja
    libxfixes
    xorg-xrandr
    xorg-xinput
    xf86-input-libinput

    gnome-keyring
    libsecret

    # Mídias removíveis:
    # - udiskie: ícone/tray para montar, desmontar e ejetar;
    # - gnome-disk-utility: diálogo seguro de formatação via UDisks2.
    udiskie
    gnome-disk-utility

    blueman
)


# ------------------------------------------------------------
# CINNAMON
# ------------------------------------------------------------
CINNAMON_PACKAGES=(
    cinnamon

    # Nemo + extensões próprias do Wolf Linux.
    nemo-python
    xed
    xreader
    xviewer
    gnome-terminal
    galculator

    # Arquivos compactados: Xarchiver permite extrair/arrastar arquivos
    # e evita depender do File Roller/libadwaita.
    xarchiver

    # Screenshots.
    flameshot

    # Integrações Wolf Linux para o Nemo.
    # A ejeção/desmontagem fica a cargo do applet nativo do Cinnamon.
    gnome-disk-utility

    # Secret Service / armazenamento de credenciais para aplicações
    # como VS Code, Chrome/Electron e clientes que usam libsecret.
    gnome-keyring
    libsecret
    # Interface gráfica para criar/inspecionar o chaveiro Login caso uma
    # instalação precise de reparo manual. Em instalações limpas, o PAM do
    # SDDM deve criar/desbloquear o chaveiro automaticamente no primeiro login.
    seahorse

    # Reforço X11 para mouse flat.
    xorg-xinput

    blueman
)


