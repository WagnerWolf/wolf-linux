    mpv
    ffmpeg

    audacious

    gimp
    obs-studio
)


# ------------------------------------------------------------
# MINIATURAS / PREVIEWS
# ------------------------------------------------------------
# Cobertura prática sem puxar stacks 3D gigantes:
# - vídeo/áudio: ffmpegthumbnailer
# - WebP: webp-pixbuf-loader
# - HEIF/AVIF: libheif
# - RAW de câmeras: libopenraw
# - WMF/APM: libwmf
# - EPUB/MOBI: gnome-epub-thumbnailer
# - ODF: libgsf
# - PDF: poppler-glib (Atril já está no MATE)
# - EXE/DLL do Windows/Wine: icoextract + Pillow
# - imagens modernas: glycin / gdk-pixbuf2
THUMBNAIL_PACKAGES=(
    ffmpegthumbnailer
    webp-pixbuf-loader

    glycin
    libheif
    libopenraw
    libwmf

    gnome-epub-thumbnailer
    libgsf
    poppler-glib

    icoextract
    python-pillow
    freetype2
)


# ------------------------------------------------------------
# INTERNET
# ------------------------------------------------------------
# transmission-qt é oficial.
INTERNET_PACKAGES=(
    transmission-qt
)

# Preferir Chaotic-AUR quando disponível, com fallback para AUR.
