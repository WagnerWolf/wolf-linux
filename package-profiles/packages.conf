# ============================================================
# WOLF LINUX 2.2.0 - LXQT/X11 PACKAGE STACKS
# ============================================================
# LXQt/Openbox X11 is the selected desktop for this release.
# Optional stacks are selected by wolf-install.sh.
# Helpers are shipped but never auto-executed.

BASE_PACKAGES=(
    base base-devel
    # Kernels oficiais do Arch instalados no pacstrap, LTS como reserva.
    linux-lts linux-lts-headers linux linux-headers
    linux-firmware
    sudo git curl wget rsync openssh pacman-contrib util-linux
    nano vim bash-completion
    networkmanager networkmanager-openvpn iwd
    grub efibootmgr os-prober
    dosfstools e2fsprogs exfatprogs ntfs-3g btrfs-progs xfsprogs lvm2
    mkinitcpio plymouth
    pciutils usbutils dmidecode smartmontools fwupd
    man-db man-pages
    unzip zip 7zip unrar
    tree ripgrep btop fastfetch plocate
    xdg-user-dirs xdg-utils
)

# Wolf LXQt X11: PCManFM-Qt nativo; utilitários KDE selecionados sem a shell Plasma.
LXQT_PACKAGES=(
    xorg-server xorg-xrandr xorg-xprop xorg-xinput xorg-xinit xf86-input-libinput
    openbox obconf-qt picom  # compositor GLX/VSync padrão da sessão LXQt/X11
    lxqt-session lxqt-panel lxqt-globalkeys lxqt-qtplugin lxqt-runner
    lxqt-notificationd lxqt-policykit lxqt-config lxqt-menu-data lxqt-themes
    lxqt-powermanagement lxqt-sudo lxqt-admin lxqt-openssh-askpass
    lxqt-archiver pcmanfm-qt pavucontrol-qt
    gvfs gvfs-mtp udisks2-lvm2  # volumes, LVM e dispositivos Android pelo explorador
    gnome-disk-utility  # avançado; bandeja Wolf Qt + formatador UDisks2 integrado
    network-manager-applet nm-connection-editor  # Wi-Fi/Ethernet/VPN na bandeja LXQt
    gnome-keyring libsecret seahorse  # Cofre seguro de credenciais para Chrome/VS Code
    xdg-desktop-portal xdg-desktop-portal-lxqt xdg-desktop-portal-gtk
    konsole kate okular gwenview spectacle kimageformats qt6-imageformats
    breeze breeze-gtk papirus-icon-theme kvantum xsettingsd
    pyside6 python python-xlib tk
    xdotool wmctrl xcape rofi
    blueman libappimage
    qt6-svg
)
LXQT_PORTAL_PACKAGES=()


AMD_CPU_PACKAGES=(amd-ucode)
INTEL_CPU_PACKAGES=(intel-ucode)

VIRTUALBOX_GUEST_PACKAGES=(virtualbox-guest-utils)

