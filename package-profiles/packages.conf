# ============================================================
# WOLF LINUX 2.0 - KDE/WAYLAND PACKAGE STACKS
# ============================================================
# KDE Plasma/Wayland is the only supported desktop in this baseline.
# Optional stacks are selected by wolf-install.sh.
# Helpers are shipped but never auto-executed.

BASE_PACKAGES=(
    base base-devel
    linux-zen linux-zen-headers
    linux-lts linux-lts-headers
    linux-firmware
    sudo git curl wget rsync openssh pacman-contrib util-linux
    nano vim bash-completion
    networkmanager networkmanager-openvpn iwd
    grub efibootmgr os-prober
    dosfstools e2fsprogs exfatprogs ntfs-3g btrfs-progs xfsprogs lvm2
    mkinitcpio plymouth
    pciutils usbutils dmidecode smartmontools fwupd
    man-db man-pages
    unzip zip 7zip unrar
    tree ripgrep btop fastfetch plocate
    xdg-user-dirs xdg-utils
)

AMD_CPU_PACKAGES=(amd-ucode)
INTEL_CPU_PACKAGES=(intel-ucode)

VIRTUALBOX_GUEST_PACKAGES=(virtualbox-guest-utils)

DISPLAY_MANAGER_PACKAGES=(
    sddm
    qt6-svg qt6-virtualkeyboard qt6-multimedia-ffmpeg
)

AUDIO_PACKAGES=(
    pipewire pipewire-audio pipewire-alsa pipewire-pulse
    wireplumber gst-plugin-pipewire rtkit
    lib32-pipewire
    pavucontrol
)

BLUETOOTH_PACKAGES=(bluez bluez-utils)

FONT_PACKAGES=(
    noto-fonts noto-fonts-cjk noto-fonts-emoji
    ttf-liberation ttf-dejavu
    ttf-meslo-nerd ttf-nerd-fonts-symbols ttf-nerd-fonts-symbols-mono
    powerline-fonts awesome-terminal-fonts terminus-font
)

THEME_PACKAGES=(papirus-icon-theme breeze-cursors)

# Plasma no Wolf Linux: equivalente ao conjunto obrigatório do plasma-meta
# do Arch (outubro/2026), EXCLUINDO Discover. Não usar o metapacote:
# ele exige o pacote discover como dependência e o reinstalaria.
KDE_PACKAGES=(
    aurorae bluedevil breeze breeze-gtk drkonqi flatpak-kcm
    kactivitymanagerd kde-cli-tools kde-gtk-config kdecoration kdeplasma-addons
    kglobalacceld kinfocenter kmenuedit knighttime kpipewire krdp
    kscreen kscreenlocker ksshaskpass ksystemstats kwallet-pam kwayland
    kwin kwrited layer-shell-qt libkscreen libksysguard libplasma milou
    ocean-sound-theme oxygen oxygen-sounds plasma-activities plasma-activities-stats
    plasma-browser-integration plasma-desktop plasma-disks plasma-firewall
    plasma-integration plasma-keyboard plasma-login-manager plasma-nm plasma-pa
    plasma-systemmonitor plasma-thunderbolt plasma-vault plasma-welcome
    plasma-workspace polkit-kde-agent powerdevil print-manager spectacle
    systemsettings xdg-desktop-portal-kde

    # Perfil KDE/Wayland e utilitários Wolf preservados.
    xorg-xwayland
    # KWrite (executável/desktop entry) já é fornecido pelo pacote kate.
    # Gwenview: visualizador de imagens para qualquer preset Plasma.
    # Plugins adicionais para formatos como WebP, TIFF, PSD e EXR.
    dolphin konsole kate gwenview kimageformats qt6-imageformats okular ark kcalc pyside6
    sddm-kcm kwalletmanager qt6-tools
)

KDE_PORTAL_PACKAGES=(
    xdg-desktop-portal
    xdg-desktop-portal-kde
)

# ------------------------------------------------------------
# OPTIONAL STACK: DAILY
# ------------------------------------------------------------
DAILY_PACKAGES=(
    cups cups-filters cups-pdf gutenprint hplip sane sane-airscan simple-scan
    libreoffice-fresh libreoffice-fresh-pt-br
    mpv ffmpeg audacious gimp obs-studio
    ffmpegthumbnailer webp-pixbuf-loader glycin libheif libopenraw libwmf
    gnome-epub-thumbnailer libgsf poppler-glib icoextract python-pillow freetype2
    transmission-qt
    flatpak
    zsh zsh-autosuggestions zsh-completions zsh-history-substring-search zsh-syntax-highlighting
)
DAILY_THIRD_PARTY_PACKAGES=(
    google-chrome
    mpc-qt
    zsh-theme-powerlevel10k
)

# ------------------------------------------------------------
# OPTIONAL STACK: GAMING
# ------------------------------------------------------------
GAMING_PACKAGES=(
    steam steam-devices
    discord
    lutris
    wine wine-mono wine-gecko winetricks protontricks
    gamemode lib32-gamemode
    evtest joyutils
    lib32-gnutls
    vkd3d lib32-vkd3d
    vulkan-icd-loader lib32-vulkan-icd-loader vulkan-tools
    yad zenity
)
GAMING_THIRD_PARTY_PACKAGES=(
    heroic-games-launcher-bin
    protonup-qt
    xpadneo-dkms
)

# ------------------------------------------------------------
# OPTIONAL STACK: DEVELOPMENT
# ------------------------------------------------------------
DEVELOPMENT_PACKAGES=(
    cmake ninja clang pkgconf glu gtk3 python python-pip acl
    jdk17-openjdk jdk21-openjdk
)
DEVELOPMENT_THIRD_PARTY_PACKAGES=(
    visual-studio-code-bin
    insomnia
)

# ------------------------------------------------------------
# OPTIONAL STACK: ANDROID + FLUTTER
# ------------------------------------------------------------
ANDROID_PACKAGES=(android-udev)
ANDROID_THIRD_PARTY_PACKAGES=(
    android-studio
    android-sdk
    android-sdk-build-tools
    android-sdk-platform-tools
    android-platform
)

# ------------------------------------------------------------
# OPTIONAL STACK: CONTAINERS
# ------------------------------------------------------------
CONTAINER_PACKAGES=(
    docker docker-compose docker-buildx lazydocker
)
CONTAINER_THIRD_PARTY_PACKAGES=()

# ------------------------------------------------------------
# OPTIONAL STACK: EXTRAS
# ------------------------------------------------------------
EXTRA_PACKAGES=()
EXTRA_THIRD_PARTY_PACKAGES=(
    ab-download-manager-bin
    jdownloader2
    balena-etcher
    qt-sudo
)

# ------------------------------------------------------------
# GPU PROFILES
# ------------------------------------------------------------
VIRTIO_GPU_PACKAGES=(mesa lib32-mesa vulkan-virtio lib32-vulkan-virtio)
VIRTUALBOX_GPU_PACKAGES=(mesa lib32-mesa)
NVIDIA_MODERN_PACKAGES=(
    nvidia-open-dkms nvidia-utils lib32-nvidia-utils nvidia-settings
    vulkan-icd-loader lib32-vulkan-icd-loader
    libva-nvidia-driver libva-utils
)
NVIDIA_NOUVEAU_PACKAGES=(
    mesa lib32-mesa xf86-video-nouveau
    vulkan-nouveau lib32-vulkan-nouveau
)
AMD_GPU_PACKAGES=(
    mesa lib32-mesa vulkan-radeon lib32-vulkan-radeon
    libva-mesa-driver lib32-libva-mesa-driver
)
INTEL_GPU_PACKAGES=(
    mesa lib32-mesa vulkan-intel lib32-vulkan-intel intel-media-driver
)
